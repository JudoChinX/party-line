# rt4k-dv1-map.conf -- cores the RT4K's DV1 cannot switch for on its own.
#
# Read by rt4k-dv1-watch.sh, which watches /tmp/CORENAME and sends
# `prof load <path>` for any core named here. Format, one per line:
#
#   <CORENAME><TAB><profile path, relative to /profile on the RT4K's card>
#
# The split is on the FIRST TAB, so core names and paths may contain spaces.
# A trailing " # comment" is ignored.
#
# ONLY list cores DV1 genuinely misses. Every other core is DV1's job, and a
# watcher that answered for it would just race DV1. To find a miss: launch the
# core, then run `rt4k-serial.py prof get`. If it still names the previous
# core's profile even though /profile/DV1/<core>.rt4 exists on the card, add
# the core here. Keys are case-sensitive and must match /tmp/CORENAME exactly;
# the RT4K's file layer is case-insensitive, so the path's case does not matter.
#
# Mapping a core to its OWN DV1/<core>.rt4 is safe even if DV1 later starts
# working for it: both load the identical file, so the race is a no-op.

# The menu core, when MiSTer.ini has [menu] direct_video=0: it emits untagged
# 1080p, so no DV1 rule can ever match it. Point this at any profile you like
# for the menu; it must exist on the card.
MENU	DV1/MENU.rt4
