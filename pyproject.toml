[project]
name = "party-line"
version = "0.2.0"
description = "Control a RetroTINK 4K from the MiSTer it is scaling, over USB serial"
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
line-length = 120
preview = true
target-version = "py39"
# v1's scripts/ are not linted; they are deleted once the package replaces them.
extend-exclude = [".venv39", "scripts"]

[tool.ruff.lint]
select = ["I", "E", "W", "D"]
ignore = ["E501", "D102", "D105"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"

[tool.pylint.master]
jobs = 0
py-version = "3.9"

[tool.pylint.messages_control]
disable = [
    "line-too-long",
    "duplicate-code",
    "too-few-public-methods",
    "redefined-outer-name",
]

[tool.pylint.design]
max-returns = 2
max-args = 10
max-positional-arguments = 10
max-attributes = 16
max-locals = 20
max-module-lines = 1200
max-parents = 8

[tool.mypy]
# mypy 2 cannot target 3.9; the 3.9 pytest run and ruff's py39 target are the syntax check.
python_version = "3.10"
disallow_untyped_defs = true
# Disable all other checks as per "Only enabled check: disallow_untyped_defs"
disable_error_code = [
    "attr-defined",
    "name-defined",
    "arg-type",
    "index",
    "import-untyped",
    "operator",
    "valid-type",
    "var-annotated",
    "misc",
    "no-any-return",
    "assignment",
    "union-attr",
    "call-arg",
    "type-var",
    "import",
    "no-untyped-call",
    "list-item",
    "dict-item",
]
check_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_return_any = true
warn_no_return = false
strict_optional = true
follow_imports = "skip"
incremental = false
exclude = [
    "__pycache__",
    "build",
    "dist",
    "product_cli_versions",
    "system_testing",
    "vendor",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=party_line --cov-report=term-missing --cov-fail-under=95"
filterwarnings = [
    "error",
]
