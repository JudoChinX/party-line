name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dev tools
        run: pip install --require-hashes -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: pylint
        run: pylint party_line/ tests/

      - name: mypy
        run: mypy party_line/ tests/

      - name: bandit
        run: bandit -r party_line/ -lll

      - name: yamllint
        run: yamllint .

      # The runner's own shellcheck, preinstalled on ubuntu-latest, not a pip package.
      - name: shellcheck
        run: shellcheck -s sh install.sh mister/*.sh utils/pre-push.sh

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: pip install --require-hashes -r requirements-test.txt

      - name: pytest
        run: pytest
