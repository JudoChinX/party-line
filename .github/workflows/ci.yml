name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install dev tools
        run: pip install --require-hashes -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: pylint
        run: pylint party_line/ tests/

      - name: mypy
        run: mypy party_line/ tests/

      - name: bandit
        run: bandit -r party_line/ -lll

      - name: yamllint
        run: yamllint .

      # The runner's own shellcheck, preinstalled on ubuntu-latest, not a pip package.
      - name: shellcheck
        run: shellcheck -s sh install.sh mister/*.sh utils/pre-push.sh

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: pip install --require-hashes -r requirements-test.txt

      - name: pytest
        run: pytest
